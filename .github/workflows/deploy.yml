name: Auto Deploy UAE Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Fix Workspace Permissions
        run: |
          sudo chown -R $USER:$USER /home/rmg/Waff_CC_Webpage/Led_Webpage/actions-runner/_work/Led_Webpage/Led_Webpage 2>/dev/null || true
          rm -rf /home/rmg/Waff_CC_Webpage/Led_Webpage/actions-runner/_work/Led_Webpage/Led_Webpage/.next 2>/dev/null || true

      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Rebuild & Start Docker Containers
        run: |
          docker compose down
          docker compose up -d --build
