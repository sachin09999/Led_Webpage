name: Auto Deploy UAE Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Rebuild & Start Docker Containers
        run: |
          docker compose down
          docker compose up -d --build
